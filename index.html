<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5b4a">
<title>Fujairah Awqaf – Soft Services Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0f5b4a; --g2:#0b4538; --g3:#e6f1ed; --gold:#b8893b; --bg:#f5f2ea; --card:#fff;
  --ink:#1d2623; --mut:#68746f; --line:#e3ded2; --soft:#faf8f3;
  --good:#2e7d4f; --fair:#d9951a; --poor:#c0392b; --na:#7b8791;
  --r:14px; --sh:0 1px 2px rgba(20,40,32,.06),0 6px 20px rgba(20,40,32,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.top{background:var(--g);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#d6ad62,#b8893b);display:grid;place-items:center;color:#0b4538;font-size:18px}
.brand small{display:block;font-weight:500;opacity:.75;font-size:11.5px;letter-spacing:.4px;margin-top:-2px}
nav{display:flex;gap:4px;margin-left:auto}
.top-in .who{margin-left:4px}
nav button{background:transparent;border:0;color:#cfe6de;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:#fff;color:var(--g)}
main{max-width:1100px;margin:0 auto;padding:18px 16px}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card + .card{margin-top:16px}
.card h2{font-size:17px;margin-bottom:12px}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1 1 240px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input[type=text],input[type=search],input[type=password],input[type=date],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(15,91,74,.13)}
input:disabled{background:var(--soft);color:var(--mut)}
textarea{resize:vertical;min-height:64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;border:1.5px solid var(--g);background:#fff;color:var(--g);font-weight:700;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--g3)}
.btn.pri{background:var(--g);color:#fff}
a.btn{text-decoration:none}
.btn.pri:hover{background:var(--g2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{border-color:#e6b9b3;color:var(--poor)}
.btn.danger:hover{background:#fbeceA}
.btn.lg{padding:14px 26px;font-size:16px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hide{display:none!important}

/* combobox */
.combo{position:relative}
.combo ul{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1.5px solid var(--g);border-radius:12px;list-style:none;margin:0;padding:4px;max-height:320px;overflow:auto;box-shadow:0 14px 34px rgba(0,0,0,.18)}
.combo li{padding:9px 11px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.combo li.act,.combo li:hover{background:var(--g3)}
.combo li b{min-width:44px;color:var(--g)}
.combo li small{color:var(--mut);margin-left:auto;text-align:right}
.combo li.none{color:var(--mut);cursor:default}

/* details */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px;margin-top:4px}
.dgrid .k{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dgrid .v{font-weight:700;font-size:16px;word-break:break-word}
.dgrid .wide{grid-column:1/-1}
.minfo{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:800px){.minfo.has-map{grid-template-columns:1.5fr 1fr}}
.mapbox{border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:190px;background:var(--soft)}
.mapbox iframe{width:100%;height:100%;min-height:190px;border:0;display:block}
.note{background:#fff7e3;border:1px solid #f0dca6;color:#7a5a10;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:12px}

/* session bar */
.sbar{position:sticky;top:57px;z-index:25;background:var(--g2);color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:16px}
.sbar .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.sbar .m{font-size:12.5px;opacity:.85;line-height:1.3}
.sbar .sp{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sbar .btn{border-color:#fff}
.sbar .btn.pri{background:#fff;color:var(--g)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9be2c0;margin-right:6px}
.dot.sv{background:#ffd166}
.dot.er{background:#ff7b6b}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;flex:1 1 100%}
.prog i{display:block;height:100%;background:#d6ad62;width:0;transition:.25s}

/* location cards */
.loc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.loc + .loc{margin-top:14px}
.loc[data-c=Good]{border-left-color:var(--good)}.loc[data-c=Fair]{border-left-color:var(--fair)}
.loc[data-c=Poor]{border-left-color:var(--poor)}.loc[data-c="N/A"]{border-left-color:var(--na)}
.loc header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.loc .n{width:28px;height:28px;border-radius:50%;background:var(--g3);color:var(--g);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.loc h3{font-size:16px;flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#eceae3;color:var(--mut)}
.pill.Good{background:#dff1e6;color:var(--good)}.pill.Fair{background:#fcefd3;color:#9a6606}
.pill.Poor{background:#f9dcd8;color:var(--poor)}.pill.NA{background:#e8ecef;color:#55616a}
.conds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.conds button{padding:11px 6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:700;cursor:pointer;color:var(--mut)}
.conds button:hover{border-color:#bdb7a5}
.conds button.on[data-v=Good]{background:var(--good);border-color:var(--good);color:#fff}
.conds button.on[data-v=Fair]{background:var(--fair);border-color:var(--fair);color:#fff}
.conds button.on[data-v=Poor]{background:var(--poor);border-color:var(--poor);color:#fff}
.conds button.on[data-v="N/A"]{background:var(--na);border-color:var(--na);color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.ph{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1;font-size:14px}
.ph.up{display:grid;place-items:center;color:var(--mut);font-size:11px;text-align:center}
.ph.err{border-color:var(--poor);color:var(--poor)}
.addph{width:86px;height:86px;border:2px dashed #b9c9c2;border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--g);font-weight:700;font-size:12px;cursor:pointer;background:var(--g3);line-height:1.25}
.addph:hover{border-color:var(--g)}
.addph span{display:block;font-size:22px;line-height:1}
.spin{width:18px;height:18px;border:2.5px solid #cfd8d4;border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* overview */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stat .k{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:30px;font-weight:800;color:var(--g);line-height:1.15;margin-top:4px}
.stat .s{font-size:12.5px;color:var(--mut)}
.bar{height:6px;background:#ece8dc;border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.latest{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--g) 0%,var(--g2) 100%);color:#fff;border:0}
.latest .no{font-size:44px;font-weight:800;line-height:1;background:rgba(255,255,255,.12);border-radius:16px;padding:16px 20px;text-align:center;min-width:104px}
.latest .no small{display:block;font-size:11px;font-weight:600;letter-spacing:.8px;opacity:.75;margin-bottom:4px}
.latest h2{font-size:20px;margin-bottom:2px}
.latest .meta{opacity:.9;font-size:13.5px;display:flex;gap:6px 16px;flex-wrap:wrap;margin:4px 0 10px}
.latest .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.latest .btn{border-color:#fff;background:transparent;color:#fff}
.latest .btn:hover{background:rgba(255,255,255,.14)}
.latest .btn.pri{background:#fff;color:var(--g)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(255,255,255,.18)}
.chip.c-Good{background:#dff1e6;color:var(--good)}.chip.c-Fair{background:#fcefd3;color:#9a6606}
.chip.c-Poor{background:#f9dcd8;color:var(--poor)}.chip.c-NA{background:#e8ecef;color:#55616a}
.chip.c-Un{background:#eee;color:#777}
.vlist{margin-top:6px}
.vrow{display:grid;grid-template-columns:70px 1.4fr 1.1fr 1fr auto;gap:10px 14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .no{font-weight:800;color:var(--g);font-size:18px}
.vrow .nm{font-weight:700}
.vrow .sub{display:block}
.vrow .acts{display:flex;gap:6px;justify-content:flex-end}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#fff0c9;color:#8a6200;vertical-align:middle}
.tag.done{background:var(--g3);color:var(--g)}
@media(max-width:720px){
  .vrow{grid-template-columns:56px 1fr;}
  .vrow .acts{grid-column:1/-1;justify-content:flex-start}
  .vrow > :nth-child(3),.vrow > :nth-child(4){grid-column:2}
  .latest{grid-template-columns:1fr}
  .latest .no{justify-self:start}
}

/* admin */
.arow{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .idx{width:26px;color:var(--mut);font-weight:700;text-align:center}
.arow input[type=text]{flex:1;min-width:0}
.arow.off input[type=text]{color:var(--mut);text-decoration:line-through}
.iconb{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.iconb:hover{border-color:var(--g);background:var(--g3)}
.iconb[disabled]{opacity:.35;cursor:default}
.sw{position:relative;width:44px;height:25px;flex:none}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#cdd3cf;border-radius:99px;cursor:pointer;transition:.15s}
.sw span::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked + span{background:var(--g)}
.sw input:checked + span::after{left:22px}

.empty{text-align:center;color:var(--mut);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1d2623;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--poor)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:90;display:none;place-items:center;padding:16px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.setup{max-width:640px;margin:40px auto}
.setup code{background:#f0ede4;padding:2px 6px;border-radius:5px}
.done-card{text-align:center;padding:30px 18px}
.done-card .tick{width:60px;height:60px;border-radius:50%;background:var(--g3);color:var(--g);display:grid;place-items:center;margin:0 auto 12px;font-size:30px}
.done-card .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.lock{max-width:380px;margin:50px auto;text-align:center}
body.landing .top,body.landing main{display:none}
#landing{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,#1b7a63 0%,var(--g) 45%,var(--g2) 100%)}
body.landing #landing{display:flex}
.lcard{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lcard .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#d6ad62,#b8893b);display:grid;place-items:center;color:#0b4538;font-size:26px;margin:0 auto 14px}
.lcard h1{font-size:21px;text-align:center}
.lcard .sub{text-align:center;margin:4px 0 20px}
.lcard input{margin-bottom:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px;font-weight:700;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cfe6de}
.who button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:700;font-size:12px}
.who button:hover{background:rgba(255,255,255,.25)}


/* ---------- general touch/mobile polish ---------- */
button,.addph,.combo li{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
nav .ic{display:none;font-style:normal}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.ph,.addph{width:100%;height:auto;aspect-ratio:1/1}
.who span{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:720px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  /* inputs at 16px stop iOS from zooming the page on focus */
  input[type=text],input[type=search],input[type=password],input[type=date],textarea,select{font-size:16px}
  .top{position:static;padding-top:env(safe-area-inset-top)}
  .top-in{padding:10px 14px;gap:8px;flex-wrap:nowrap}
  .brand{min-width:0}.brand small{display:none}
  .who{margin-left:auto;min-width:0}
  .who span{max-width:34vw;font-size:12px}
  main{padding:14px 12px}
  .card{padding:14px}
  /* bottom tab bar */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;gap:0;background:#fff;border-top:1px solid var(--line);
      box-shadow:0 -4px 18px rgba(0,0,0,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--mut);font-size:11.5px;border-radius:12px}
  nav button:hover{background:transparent}
  nav button.on{background:var(--g3);color:var(--g)}
  nav .ic{display:block;font-size:20px;line-height:1.1}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
  /* session bar */
  .sbar{top:8px;padding:10px 12px;gap:8px}
  .sbar .t{font-size:21px}
  .sbar .sp{margin-left:0;width:100%;justify-content:space-between}
  .sbar .sp .btn.pri{flex:1}
  .sbar .btn{padding:9px 12px}
  /* mosque picker + details */
  .combo li{display:grid;grid-template-columns:48px 1fr;gap:1px 8px;padding:11px;align-items:baseline}
  .combo li small{grid-column:2;margin-left:0;text-align:left}
  .combo li.none{display:block}
  .combo ul{max-height:50vh}
  .dgrid{grid-template-columns:1fr 1fr;gap:12px}
  #btn-start{width:100%}
  #start-wrap .sub{display:block;margin:8px 0 0!important;text-align:center}
  .mapbox,.mapbox iframe{min-height:170px}
  /* location cards */
  .loc{padding:14px 12px}
  .loc h3{font-size:15px}
  .conds{gap:6px}.conds button{padding:13px 2px}
  .addph{font-size:11px}
  /* overview */
  .stat .v{font-size:26px}
  .latest .no{font-size:36px;padding:12px 16px}
  .latest .acts .btn{flex:1}
  .vrow .acts .btn{padding:9px 16px}
  /* admin: name on its own line, controls underneath */
  .arow{flex-wrap:wrap;gap:8px 8px}
  .arow .idx{display:none}
  .arow input[type=text]{flex:1 1 100%}
  .arow .iconb:first-of-type{margin-left:0}
  .arow .sw{margin-left:auto}
  .iconb{width:42px;height:42px}
  #add-loc{width:100%}
  .done-card .acts .btn{flex:1 1 40%}
  .lcard{padding:24px 20px}
}
@media(max-width:380px){.dgrid{grid-template-columns:1fr}.conds button{font-size:13px}}

.errbox{background:#fdecea;border:1px solid #f1b9b2;color:#8f2418;border-radius:10px;padding:10px 13px;font-size:13.5px;margin:10px 0}
.errbox code{background:#fff;padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0 8px}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.pre button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--g);cursor:pointer}
.pre button:hover{border-color:var(--g);background:var(--g3)}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:6px 0}
.chk input{width:18px;height:18px;accent-color:var(--g)}
.rcount{font-weight:700;color:var(--g);min-height:22px;margin:4px 0 12px}

/* visit viewer */
.vm{position:fixed;inset:0;background:rgba(15,25,21,.6);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.vm.on{display:flex}
.vm-p{background:var(--bg);width:100%;max-width:820px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;margin:auto 0}
.vm-h{background:var(--g);color:#fff;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.vm-h .no{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;font-weight:800;font-size:24px;line-height:1.1;text-align:center;flex:none}
.vm-h .no small{display:block;font-size:9.5px;letter-spacing:.8px;font-weight:700;opacity:.8}
.vm-h h2{font-size:18px;margin-bottom:2px}
.vm-h .meta{font-size:13px;opacity:.9;display:flex;gap:4px 14px;flex-wrap:wrap}
.vm-x{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.vm-x:hover{background:rgba(255,255,255,.3)}
.vm-b{padding:16px}
.vm-b .loc + .loc{margin-top:12px}
.vm-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.vm-ph img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block;background:var(--soft)}
.vm-rem{background:var(--soft);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.vm-rem b{display:block;font-size:11px;letter-spacing:.5px;color:var(--mut);text-transform:uppercase;margin-bottom:2px}
.lb{z-index:95}
@media(max-width:720px){.vm{padding:0}.vm-p{border-radius:0;min-height:100%}.vm-h{padding-top:calc(14px + env(safe-area-inset-top))}}

/* sites list */
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.seg button{flex:1 1 130px;padding:10px 12px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-weight:700;cursor:pointer;color:var(--mut);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button b{font-size:20px;color:var(--ink)}
.seg button.on{border-color:var(--g);background:var(--g3);color:var(--g)}
.seg button.on b{color:var(--g)}
.seg button.warn.on{border-color:var(--fair);background:#fdf3de;color:#8a5a00}.seg button.warn.on b{color:#8a5a00}
.shead,.srow{display:grid;grid-template-columns:90px 90px 1.7fr 1.5fr 120px;gap:10px;align-items:center;padding:11px 8px}
.shead{background:var(--g);color:#fff;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:9px 8px}
.shead button{background:none;border:0;color:#fff;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;text-align:left;padding:0}
.shead button.on::after{content:attr(data-a);margin-left:4px}
.srow{border-bottom:1px solid var(--line)}
.srow .no{font-weight:800;color:var(--g);font-size:17px}
.srow .nm{font-weight:600}
.srow .zn{font-size:12.5px;font-weight:700;color:var(--mut)}
.nv{display:inline-block;background:#fdf3de;color:#8a5a00;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}
.srow .sub{display:block}
@media(max-width:720px){
  .shead{display:none}
  .srow{grid-template-columns:62px 1fr auto;gap:2px 10px;padding:12px 4px}
  .srow > :nth-child(1){grid-column:1;grid-row:1}
  .srow > :nth-child(2){grid-column:1;grid-row:2}
  .srow > :nth-child(3){grid-column:2;grid-row:1}
  .srow > :nth-child(4){grid-column:2;grid-row:2}
  .srow > :nth-child(5){grid-column:3;grid-row:1/3}
}
</style>
</head>
<body>

<section id="landing">
  <div class="lcard">
    <div class="mark">☪</div>
    <h1>Fujairah Awqaf</h1>
    <p class="sub">Soft Services Inspection</p>
    <form id="login">
      <input type="text" id="em" inputmode="email" autocomplete="username" placeholder="Email" aria-label="Email">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button class="btn pri" id="li" style="width:100%">Sign in</button>
    </form>
    <div class="or">OR</div>
    <button class="btn" id="guest" style="width:100%">Continue as guest</button>
    <p class="sub" style="margin:14px 0 0;font-size:12px">Guests can record inspections. Reports and managing locations need an admin account.</p>
  </div>
</section>

<header class="top">
  <div class="top-in">
    <div class="brand"><div class="mark">☪</div><div>Fujairah Awqaf<small>SOFT SERVICES INSPECTION</small></div></div>
    <nav>
      <button data-v="overview" class="on"><i class="ic">📊</i><span>Overview</span></button>
      <button data-v="inspect"><i class="ic">📝</i><span>Inspection</span></button>
      <button data-v="sites"><i class="ic">🗺️</i><span>Sites</span></button>
      <button data-v="admin" class="hide" id="nav-admin"><i class="ic">⚙️</i><span>Admin</span></button>
    </nav>
    <div class="who"><span id="who-t"></span><button id="who-b"></button></div>
  </div>
</header>

<main>
  <!-- ================= OVERVIEW ================= -->
  <section id="v-overview" class="view on"></section>

  <!-- ================= INSPECTION ================= -->
  <section id="v-inspect" class="view">
    <div id="pick-card" class="card">
      <h2>1 · Select Mosque</h2>
      <div class="row">
        <div class="grow" style="flex-basis:340px">
          <label class="f" for="mq-input">Mosque number or name</label>
          <div class="combo">
            <input type="text" id="mq-input" placeholder="Type to search — e.g. 306 or Hamza" autocomplete="off" role="combobox" aria-expanded="false">
            <ul id="mq-list" class="hide" role="listbox"></ul>
          </div>
        </div>
        <div class="grow" style="flex-basis:200px">
          <label class="f" for="inspector">Inspector name (optional)</label>
          <input type="text" id="inspector" placeholder="Your name" autocomplete="name">
        </div>
      </div>
      <div id="open-note" class="note hide"></div>
    </div>

    <div id="detail-card" class="card hide">
      <div id="detail-body"></div>
      <div style="margin-top:18px" id="start-wrap">
        <button class="btn pri lg" id="btn-start">▶ Start Activity</button>
        <span class="sub" style="margin-left:10px">Start time is captured automatically.</span>
      </div>
    </div>

    <div id="stage" class="hide">
      <div class="sbar" id="sbar">
        <div>
          <div class="t" id="timer">00:00:00</div>
          <div class="m" id="sbar-m"></div>
        </div>
        <div class="sp">
          <span class="m"><i class="dot" id="sdot"></i><span id="stxt">Saved</span></span>
          <button class="btn sm danger" id="btn-cancel" style="background:transparent;color:#ffb4aa;border-color:#ffb4aa">Discard</button>
          <button class="btn pri" id="btn-finish">■ Finish Activity</button>
        </div>
        <div class="prog"><i id="progbar"></i></div>
      </div>
      <h2 style="margin:4px 2px 12px;font-size:17px">2 · Soft Service Scopes <span class="sub" id="progtxt"></span></h2>
      <div id="locs"></div>
    </div>

    <div id="done" class="card done-card hide"></div>
  </section>

  <!-- ================= ADMIN ================= -->
  <section id="v-sites" class="view"></section>

  <section id="v-admin" class="view"></section>
</main>

<div class="vm" id="vm" role="dialog" aria-modal="true"><div class="vm-p" id="vm-p"></div></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img alt=""></div>
<input type="file" id="file-in" accept="image/*" multiple class="hide">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* =====================================================================
   CONFIGURATION — fill these in before deploying
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://bymdxtlbtcvsoqfcmbaa.supabase.co",          // e.g. https://abcdxyz.supabase.co
  SUPABASE_KEY: "sb_publishable_VoSR6DTp6pwLwQ0V6xEuXA_QKl6CF_0",          // the "anon / public" key
  UPLOAD_URL:   "https://awqaf-photos.azzurro-reports.workers.dev",          // your Cloudflare Worker URL, e.g. https://awqaf-photos.yourname.workers.dev
  UPLOAD_TOKEN: "qaviXCLIbdLGocNBDIfAInaUjQAsrtjc",          // same value as the Worker's UPLOAD_TOKEN secret
  TZ:           "Asia/Dubai", // time zone used for dates/times in the app and reports
  TZ_OFFSET:    "+04:00",     // that time zone's UTC offset (used for the report date filter)
  PHOTO_MAX_PX: 1280,         // longest side of stored photos (1280 is sharp on screen and in reports)
  PHOTO_TARGET_KB: 230        // aim for photos no bigger than this (lower = less storage)
};
/* ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COND = ['Good', 'Fair', 'Poor', 'N/A'];
const cls = c => c === 'N/A' ? 'NA' : (c || 'Un');

/* ---------- date helpers (always shown in CONFIG.TZ) ---------- */
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-GB', {timeZone: CONFIG.TZ, day:'2-digit', month:'short', year:'numeric'}) : '—';
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('en-US', {timeZone: CONFIG.TZ, hour:'2-digit', minute:'2-digit', hour12:true}) : '—';
const fmtDT = iso => iso ? fmtDate(iso) + ', ' + fmtTime(iso) : '—';
const dayKey = iso => new Date(iso).toLocaleDateString('en-CA', {timeZone: CONFIG.TZ});
function fmtDur(a, b) {
  if (!a || !b) return '—';
  const m = Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`;
}

let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), err ? 5000 : 2600);
}

/* ---------- duplicate-safe helpers ---------- */
const nameKey = n => String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
/* If the same location was ever saved twice for one visit, show/report it once:
   keep the condition, join remarks, combine photos. */
function mergeItems(items) {
  const map = new Map(), out = [];
  (items || []).forEach(it => {
    const k = nameKey(it.location_name), g = map.get(k);
    if (!g) { const c = {...it, photos: [...(it.photos || [])]}; map.set(k, c); out.push(c); return; }
    if (!g.condition && it.condition) g.condition = it.condition;
    if (it.remarks && !(g.remarks || '').includes(it.remarks)) g.remarks = [g.remarks, it.remarks].filter(Boolean).join('\n');
    (it.photos || []).forEach(u => { if (!g.photos.includes(u)) g.photos.push(u); });
    g.sort_order = Math.min(g.sort_order ?? 0, it.sort_order ?? 0);
  });
  return out.sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
}

/* ---------- boot ---------- */
const S = { mosques: [], locations: [], selected: null, visit: null, items: {}, order: [], timers: {}, uploads: 0, tick: null };
let sb = null;

if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY) {
  $('main').innerHTML = `<div class="card setup"><h2>Setup needed</h2>
  <p>Open <code>index.html</code> and fill in <code>CONFIG.SUPABASE_URL</code> and <code>CONFIG.SUPABASE_KEY</code> near the top of the script, then redeploy.</p>
  <p class="sub">See SETUP.md for the full steps.</p></div>`;
} else {
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  init();
}

async function init() {
  $$('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
  $('#inspector').value = localStorage.getItem('awqaf_inspector') || '';
  try {
    const {data, error} = await sb.from('mosques').select('*').order('sl_no');
    if (error) throw error;
    S.mosques = data.map(m => ({...m, _s: `${m.mosque_number} ${m.name} ${m.location || ''} ${m.zone || ''}`.toLowerCase()}));
  } catch (e) { toast('Could not load mosque list: ' + (e.message || e), true); console.error(e); }
  initCombo();
  $('#btn-start').onclick = startVisit;
  $('#btn-finish').onclick = finishVisit;
  $('#btn-cancel').onclick = discardVisit;
  $('#lb').onclick = () => $('#lb').classList.remove('on');
  $('#login').onsubmit = async e => {
    e.preventDefault(); const b = $('#li'); b.disabled = true;
    const {data, error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value});
    b.disabled = false;
    if (error) return toast(error.message, true);
    sessionStorage.removeItem('awqaf_guest'); $('#pw').value = '';
    enterApp(data.session);
  };
  $('#guest').onclick = () => { sessionStorage.setItem('awqaf_guest', '1'); enterApp(null); };
  $('#who-b').onclick = signOut;
  const {data: {session}} = await sb.auth.getSession();
  if (session) enterApp(session);
  else if (sessionStorage.getItem('awqaf_guest') === '1') enterApp(null);
  else document.body.classList.add('landing');
}

async function enterApp(session) {
  S.admin = false;
  if (session) {
    const {data} = await sb.from('admins').select('user_id').eq('user_id', session.user.id);
    S.admin = !!(data && data.length);
  }
  $('#who-t').textContent = session ? session.user.email + (S.admin ? ' · Admin' : '') : 'Guest';
  $('#who-b').textContent = session ? 'Sign out' : 'Sign in';
  $('#nav-admin').classList.toggle('hide', !S.admin);
  document.body.classList.remove('landing');
  go(location.hash.slice(1) || 'overview');
}

async function signOut() {
  if (S.visit && !confirm('An inspection is in progress (it is saved and can be resumed later). Leave now?')) return;
  sessionStorage.removeItem('awqaf_guest');
  await sb.auth.signOut();
  location.hash = ''; location.reload();
}

function go(v) {
  if (!['overview', 'inspect', 'sites', 'admin'].includes(v) || (v === 'admin' && !S.admin)) v = 'overview';
  $$('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  history.replaceState(null, '', '#' + v);
  window.scrollTo(0, 0);
  if (v === 'overview') loadOverview();
  if (v === 'sites') loadSites();
  if (v === 'admin') renderAdmin();
}

/* =====================================================================
   OVERVIEW
   ===================================================================== */
let OV = { visits: [], q: '', shown: 20 };

async function loadOverview() {
  const el = $('#v-overview');
  if (!OV.visits.length) el.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  const {data, error} = await sb.from('visits').select('*, visit_items(condition, location_name, sort_order)').order('started_at', {ascending: false}).limit(500);
  if (error) { el.innerHTML = `<div class="card empty">Could not load visits.<br><span class="sub">${esc(error.message)}</span></div>`; return; }
  data.forEach(v => v.visit_items = mergeItems(v.visit_items));
  OV.visits = data;
  renderOverview();
}

function tally(items) {
  const t = {Good: 0, Fair: 0, Poor: 0, 'N/A': 0, Un: 0};
  (items || []).forEach(i => t[i.condition || 'Un']++);
  return t;
}
function chips(t) {
  return ['Good', 'Fair', 'Poor', 'N/A'].filter(k => t[k]).map(k => `<span class="chip c-${cls(k)}">${t[k]} ${k}</span>`).join('');
}

function renderOverview() {
  const V = OV.visits, el = $('#v-overview');
  const today = dayKey(new Date().toISOString());
  const covered = new Set(V.map(v => v.mosque_id ?? v.mosque_number)).size;
  const total = S.mosques.length || 1;
  const open = V.filter(v => v.status === 'in_progress').length;
  const todayN = V.filter(v => dayKey(v.started_at) === today).length;
  const last = V.find(v => v.status === 'completed') || V[0];

  let latestHTML = `<div class="card empty">No inspections yet. Start one from the <b>Inspection</b> tab.</div>`;
  if (last) {
    const t = tally(last.visit_items), done = last.status === 'completed';
    latestHTML = `<div class="card latest">
      <div class="no"><small>MOSQUE NO.</small>${esc(last.mosque_number)}</div>
      <div>
        <div style="font-size:12px;letter-spacing:.8px;font-weight:700;opacity:.75">LATEST SITE VISIT</div>
        <h2>${esc(last.mosque_name || '—')}</h2>
        <div class="meta"><span>📅 ${fmtDate(last.started_at)}</span><span>🕒 ${fmtTime(last.started_at)} – ${done ? fmtTime(last.finished_at) : 'in progress'}</span>
          ${done ? `<span>⏱ ${fmtDur(last.started_at, last.finished_at)}</span>` : ''}
          <span>📍 ${esc(last.zone || '')}${last.location ? ' · ' + esc(last.location) : ''}</span>
          ${last.inspector ? `<span>👤 ${esc(last.inspector)}</span>` : ''}</div>
        <div class="chips">${chips(t) || '<span class="chip">No conditions recorded</span>'}</div>
        <div class="acts">
          ${done ? `<button class="btn pri" data-view="${last.id}">👁 View details</button>` : ''}
          ${done ? (S.admin ? `<button class="btn" data-rep="pdf" data-id="${last.id}">⬇ Generate PDF Report</button>
                    <button class="btn" data-rep="xlsx" data-id="${last.id}">⬇ Excel Report</button>` : '')
                 : resumeBtn(last.id)}
          ${S.admin ? `<button class="btn" data-del="${last.id}">🗑 Delete</button>` : ''}
        </div>
      </div></div>`;
  }

  el.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Total inspections</div><div class="v">${V.length}</div><div class="s">${V.filter(v => v.status === 'completed').length} completed</div></div>
      <div class="stat"><div class="k">Mosques covered</div><div class="v">${covered}<span style="font-size:16px;color:var(--mut)"> / ${S.mosques.length}</span></div><div class="bar"><i style="width:${Math.min(100, covered / total * 100)}%"></i></div></div>
      <div class="stat"><div class="k">Visits today</div><div class="v">${todayN}</div><div class="s">${new Date().toLocaleDateString('en-GB', {timeZone: CONFIG.TZ, weekday: 'long', day: 'numeric', month: 'short'})}</div></div>
      <div class="stat"><div class="k">In progress</div><div class="v">${open}</div><div class="s">${open ? 'tap Resume below' : 'all closed'}</div></div>
    </div>
    ${latestHTML}
    <div class="card">
      <div class="row" style="align-items:center;margin-bottom:4px">
        <h2 style="margin:0;flex:1 1 200px">Site visits</h2>
        <div style="flex:1 1 240px"><input type="search" id="ov-q" placeholder="Filter by mosque no. or name" value="${esc(OV.q)}"></div>
      </div>
      <div class="vlist" id="vlist"></div>
    </div>`;
  $('#ov-q').oninput = e => { OV.q = e.target.value; OV.shown = 20; renderVList(); };
  renderVList();
  bindActions(el);
}

function renderVList() {
  const q = OV.q.trim().toLowerCase();
  const list = OV.visits.filter(v => !q || `${v.mosque_number} ${v.mosque_name || ''}`.toLowerCase().includes(q));
  const box = $('#vlist');
  if (!list.length) { box.innerHTML = `<div class="empty">${OV.visits.length ? 'No matching visits.' : 'No visits recorded yet.'}</div>`; return; }
  box.innerHTML = list.slice(0, OV.shown).map(v => {
    const done = v.status === 'completed';
    return `<div class="vrow">
      <div class="no">${esc(v.mosque_number)}</div>
      <div><span class="nm">${esc(v.mosque_name || '—')}</span> <span class="tag ${done ? 'done' : ''}">${done ? 'Completed' : 'In progress'}</span>
        <span class="sub">${esc(v.zone || '')}${v.location ? ' · ' + esc(v.location) : ''}${v.inspector ? ' · ' + esc(v.inspector) : ''}</span></div>
      <div>${fmtDate(v.started_at)}<span class="sub">${fmtTime(v.started_at)} – ${done ? fmtTime(v.finished_at) : '…'}${done ? ' · ' + fmtDur(v.started_at, v.finished_at) : ''}</span></div>
      <div class="chips" style="--x:0">${chips(tally(v.visit_items)).replace(/chip c-/g, 'chip c-')}</div>
      <div class="acts">${done
        ? `<button class="btn sm pri" data-view="${v.id}">View</button>` + (S.admin ? `<button class="btn sm" data-rep="pdf" data-id="${v.id}">PDF</button><button class="btn sm" data-rep="xlsx" data-id="${v.id}">Excel</button>` : '')
        : resumeBtn(v.id, true)}${S.admin ? `<button class="btn sm danger" data-del="${v.id}" title="Delete this visit" aria-label="Delete visit">🗑</button>` : ''}</div>
    </div>`;
  }).join('') + (list.length > OV.shown ? `<div style="text-align:center;padding-top:12px"><button class="btn sm" id="more">Show more (${list.length - OV.shown})</button></div>` : '');
  const more = $('#more'); if (more) more.onclick = () => { OV.shown += 20; renderVList(); bindActions(box); };
  bindActions(box);
}

/* best-effort removal of photo files from Cloudflare (needs the updated worker.js; failures are ignored) */
async function deletePhotos(urls) {
  const base = (CONFIG.UPLOAD_URL || '').replace(/\/$/, '');
  if (!base) return;
  await Promise.allSettled([...new Set(urls)].filter(u => u && u.startsWith(base + '/f/')).map(u =>
    fetch(u, {method: 'DELETE', headers: {'Authorization': 'Bearer ' + CONFIG.UPLOAD_TOKEN}})));
}

async function deleteVisit(btn, id) {
  if (!S.admin) return toast('Only admins can delete visits', true);
  const v = OV.visits.find(x => x.id === id); if (!v) return;
  if (!confirm(`Delete this inspection?\n\nMosque ${v.mosque_number} - ${v.mosque_name || ''}\n${fmtDT(v.started_at)}\n\nAll its results, remarks and photos will be permanently removed. This cannot be undone.`)) return;
  btn.disabled = true;
  try {
    const {data: its, error: e1} = await sb.from('visit_items').select('photos').eq('visit_id', id);
    if (e1) throw e1;
    const {error} = await sb.from('visits').delete().eq('id', id);
    if (error) throw error;
    OV.visits = OV.visits.filter(x => x.id !== id); SI.visits = null;
    if (S.visit && S.visit.id === id) { Object.values(S.timers).forEach(clearTimeout); S.timers = {}; resetInspection(); }
    renderOverview();
    toast('Inspection deleted');
    deletePhotos((its || []).flatMap(i => i.photos || []));
  } catch (e) { btn.disabled = false; toast('Could not delete: ' + (e.message || e), true); console.error(e); }
}

/* read-only details of a completed visit, with photos (available to everyone) */
async function viewVisit(id) {
  const vm = $('#vm'), p = $('#vm-p');
  p.innerHTML = '<div class="empty" style="padding:60px"><span class="spin"></span></div>';
  vm.classList.add('on'); document.body.style.overflow = 'hidden';
  try {
    let [{data: v, error: e1}, {data: items, error: e2}] = await Promise.all([
      sb.from('visits').select('*').eq('id', id).single(),
      sb.from('visit_items').select('*').eq('visit_id', id).order('sort_order')
    ]);
    if (e1) throw e1; if (e2) throw e2;
    items = mergeItems(items);

        <span>📍 ${esc(v.zone || '')}${v.location ? ' · ' + esc(v.location) : ''}</span>${v.inspector ? `<span>👤 ${esc(v.inspector)}</span>` : ''}</div></div>
      <button class="vm-x" id="vm-x" aria-label="Close">×</button></div>
      <div class="vm-b"><div class="chips" style="margin-bottom:14px">${chips(t) || ''}${t.Un ? `<span class="chip c-Un">${t.Un} Not assessed</span>` : ''}</div>
      ${items.length ? items.map((it, i) => `<article class="loc" data-c="${esc(it.condition || '')}">
        <header style="margin-bottom:0"><span class="n">${i + 1}</span><h3>${esc(it.location_name)}</h3><span class="pill ${cls(it.condition)}">${it.condition || 'Not assessed'}</span></header>
        ${it.remarks ? `<div class="vm-rem"><b>Remarks</b>${esc(it.remarks)}</div>` : ''}
        ${(it.photos || []).length ? `<div class="vm-ph">${it.photos.map((u, j) => `<img src="${esc(u)}" alt="Photo ${j + 1}" loading="lazy" data-full="${esc(u)}">`).join('')}</div>` : ''}
      </article>`).join('') : '<div class="empty">No location details were recorded for this visit.</div>'}</div>`;
    $('#vm-x').onclick = closeView;
    $$('.vm-ph img', p).forEach(im => im.onclick = () => { $('#lb img').src = im.dataset.full; $('#lb').classList.add('on'); });
  } catch (e) { closeView(); toast('Could not load visit: ' + (e.message || e), true); console.error(e); }
}
function closeView() { $('#vm').classList.remove('on'); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#lb').classList.contains('on')) $('#lb').classList.remove('on'); else closeView(); } });

function bindActions(root) {

/* =====================================================================
   INSPECTION — mosque picker
   ===================================================================== */
function initCombo() {
  const inp = $('#mq-input'), list = $('#mq-list');
  let shown = [], idx = -1;

  const render = () => {
    const q = inp.value.trim().toLowerCase();
    let arr = S.mosques;
    if (q) {
      arr = arr.filter(m => m._s.includes(q));
      arr.sort((a, b) => (b.mosque_number.toLowerCase() === q) - (a.mosque_number.toLowerCase() === q)
        || (b.mosque_number.toLowerCase().startsWith(q)) - (a.mosque_number.toLowerCase().startsWith(q)));
    }
    shown = arr.slice(0, 60); idx = shown.length && q ? 0 : -1;
    list.innerHTML = shown.length ? shown.map((m, i) =>
      `<li role="option" data-i="${i}" class="${i === idx ? 'act' : ''}"><b>${esc(m.mosque_number)}</b><span>${esc(m.name.trim())}</span><small>${[m.location, m.zone].filter(Boolean).map(esc).join(' · ')}</small></li>`).join('')
      + (arr.length > 60 ? `<li class="none">…${arr.length - 60} more — keep typing to narrow down</li>` : '')
      : `<li class="none">No mosque matches “${esc(inp.value)}”</li>`;
    list.classList.remove('hide'); inp.setAttribute('aria-expanded', 'true');
  };
  const close = () => { list.classList.add('hide'); inp.setAttribute('aria-expanded', 'false'); };
  const hi = () => $$('li', list).forEach((li, i) => { li.classList.toggle('act', i === idx); if (i === idx) li.scrollIntoView({block: 'nearest'}); });

  inp.addEventListener('focus', () => { if (!S.visit) { inp.select(); render(); } });
  inp.addEventListener('input', () => { if (S.selected && inp.value !== labelOf(S.selected)) clearSelection(true); render(); });
  inp.addEventListener('keydown', e => {
    if (list.classList.contains('hide') && e.key === 'ArrowDown') render();
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(shown.length - 1, idx + 1); hi(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); hi(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (shown[idx]) { pick(shown[idx]); close(); } }
    else if (e.key === 'Escape') close();
  });
  list.addEventListener('mousedown', e => {
    const li = e.target.closest('li[data-i]'); if (!li) return;
    e.preventDefault(); pick(shown[+li.dataset.i]); close(); inp.blur();
  });
  document.addEventListener('mousedown', e => { if (!e.target.closest('.combo')) close(); });
  inp.addEventListener('blur', () => setTimeout(close, 120));
}

/* =====================================================================
   INSPECTION — run a visit
   ===================================================================== */
async function loadActiveLocations() {
  const {data, error} = await sb.from('locations').select('*').eq('active', true).order('sort_order').order('id');
  if (error) throw error;
  const seen = new Set();
  return data.filter(l => { const k = nameKey(l.name); if (seen.has(k)) return false; seen.add(k); return true; });
}

// visits started on this device (so only their owner, or an admin, can resume them)
const MINE_KEY = 'awqaf_mine';
function myVisits() { try { return JSON.parse(localStorage.getItem(MINE_KEY) || '[]'); } catch (e) { return []; } }
function markMine(id) { try { const a = myVisits().filter(x => x !== id); a.push(id); localStorage.setItem(MINE_KEY, JSON.stringify(a.slice(-100))); } catch (e) {} }
function canResume(id) { return S.admin || myVisits().includes(id); }
const resumeBtn = (id, sm) => canResume(id) ? `<button class="btn${sm ? ' sm' : ''} pri" data-resume="${id}">${sm ? 'Resume' : 'Resume inspection'}</button>` : `<span class="chip">In progress · only its inspector or an admin can resume</span>`;

async function startVisit() {
  const m = S.selected; if (!m) return;
  const btn = $('#btn-start'); btn.disabled = true;
  try {
    const locs = await loadActiveLocations();
    if (!locs.length) { toast('No locations configured. Add some in the Admin tab first.', true); btn.disabled = false; return; }
    const inspector = $('#inspector').value.trim();
    localStorage.setItem('awqaf_inspector', inspector);
    const {data, error} = await sb.from('visits').insert({
      mosque_id: m.id, mosque_number: m.mosque_number, mosque_name: m.name.trim(), zone: m.zone, location: m.location, inspector: inspector || null
    }).select().single();
    if (error) throw error;
    S.visit = data; markMine(data.id);
    S.order = locs.map((l, i) => ({key: 'l' + l.id, location_id: l.id, name: l.name, sort: i}));
    S.items = {};
    S.order.forEach(o => S.items[o.key] = {id: crypto.randomUUID(), condition: null, remarks: '', photos: [], up: 0, err: 0, saved: false});
    enterStage();
  } catch (e) { toast('Could not start: ' + (e.message || e), true); console.error(e); }
  btn.disabled = false;
}

async function resumeVisit(id) {
  if (!canResume(id)) { toast('Only the inspector who started this visit, or an admin, can resume it.', true); return; }
  if (S.visit && S.visit.id === id) { go('inspect'); return; }          // already open here: just go back to it
  if (S.visit && !confirm('You have another inspection open on this device. Switch to the one you tapped?')) return;
  try {
    let [{data: v, error: e1}, {data: its, error: e2}, locs] = await Promise.all([
      sb.from('visits').select('*').eq('id', id).single(),
      sb.from('visit_items').select('*').eq('visit_id', id).order('sort_order'),
      loadActiveLocations()
    ]);
    if (e1) throw e1; if (e2) throw e2;
    if (!S.visit || S.visit.id !== v.id) {
      const who = [v.mosque_number + ' ' + (v.mosque_name || ''), v.inspector ? 'by ' + v.inspector : '', 'started ' + fmtDT(v.started_at)].filter(Boolean).join(' · ');
      if (!confirm('Continue this unfinished inspection?\n\n' + who + '\n\nIf someone else is still working on it, wait for them to finish instead.')) return;
    }
    S.visit = v; S.order = []; S.items = {};
    its = mergeItems(its);
    const byLoc = new Map(its.map(i => [nameKey(i.location_name), i]));
    const mk = (key, location_id, name, it) => {
      S.order.push({key, location_id, name, sort: S.order.length});
      S.items[key] = it ? {id: it.id, condition: it.condition, remarks: it.remarks || '', photos: it.photos || [], up: 0, err: 0, saved: true}
                        : {id: crypto.randomUUID(), condition: null, remarks: '', photos: [], up: 0, err: 0, saved: false};
    };
    locs.forEach(l => mk('l' + l.id, l.id, l.name, byLoc.get(nameKey(l.name))));
    // saved items whose location was since removed/deactivated
    its.filter(i => !locs.some(l => nameKey(l.name) === nameKey(i.location_name))).forEach(i => mk('i' + i.id, i.location_id, i.location_name, i));
    S.selected = S.mosques.find(m => m.id === v.mosque_id) || null;
    $('#mq-input').value = `${v.mosque_number} — ${v.mosque_name || ''}`;
    $('#inspector').value = v.inspector || '';
    enterStage();
    toast('Inspection resumed');
  } catch (e) { toast('Could not resume: ' + (e.message || e), true); console.error(e); }
}

    + Array.from({length: it.up}, () => `<div class="ph up"><span class="spin"></span></div>`).join('')

/* ---------- photo handling: compress in browser, upload to Cloudflare ---------- */
/* Shrinks a phone photo (typically 3-8 MB) to ~150-230 KB: scaled to PHOTO_MAX_PX, then JPEG quality is
   lowered step by step until it fits PHOTO_TARGET_KB. Quality never drops below 0.55, which is still clean
   for A4 reports (a photo is printed ~55 mm wide, so >700 px is already beyond print resolution). */
function loadImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Not a readable image')); };
    img.src = u;
  });
}
const toBlob = (c, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('compress failed')), 'image/jpeg', q));

async function compress(file) {
  const target = (CONFIG.PHOTO_TARGET_KB || 230) * 1024, top = CONFIG.PHOTO_MAX_PX || 1280;
  const img = await loadImg(file), long = Math.max(img.naturalWidth, img.naturalHeight);
  let best = null;
  for (const px of [top, Math.round(top * 0.85), Math.round(top * 0.72)]) {
    const r = Math.min(1, px / long), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * r)); c.height = Math.max(1, Math.round(img.naturalHeight * r));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
    for (const q of [0.78, 0.72, 0.66, 0.6, 0.55]) {
      const b = await toBlob(c, q);
      if (!best || b.size < best.size) best = b;
      if (b.size <= target) return b;
    }
  }
  return best;   // smallest we could get
}

async function uploadOne(blob) {
  if (!CONFIG.UPLOAD_URL) throw new Error('UPLOAD_URL is not configured');
  const r = await fetch(`${CONFIG.UPLOAD_URL.replace(/\/$/, '')}/upload?visit=${S.visit.id}`, {
    method: 'POST', headers: {'Authorization': 'Bearer ' + CONFIG.UPLOAD_TOKEN, 'Content-Type': 'image/jpeg'}, body: blob
  });
  if (!r.ok) throw new Error('Upload failed (' + r.status + ')');
  return (await r.json()).url;
}

async function uploadFiles(k, files) {
  const it = S.items[k];
  it.up += files.length; S.uploads += files.length; renderPhotos(k); updateFinish();
  await Promise.all(files.map(async f => {
    try { const url = await uploadOne(await compress(f)); it.photos.push(url); }
    catch (e) { it.err++; toast('Photo upload failed: ' + e.message, true); console.error(e); }
    finally { it.up--; S.uploads--; renderPhotos(k); updateFinish(); }
  }));
  queueSave(k);
}

/* ---------- autosave ---------- */
function setSave(s) {
  const d = $('#sdot'), t = $('#stxt');
  d.className = 'dot' + (s === 'saving' ? ' sv' : s === 'err' ? ' er' : '');
  t.textContent = s === 'saving' ? 'Saving…' : s === 'err' ? 'Not saved – retrying on next change' : 'All changes saved';
}
function queueSave(k) {
  setSave('saving'); clearTimeout(S.timers[k]);
  S.timers[k] = setTimeout(() => saveItem(k), 500);
}
async function saveItem(k) {
  clearTimeout(S.timers[k]); delete S.timers[k];
  const it = S.items[k], o = S.order.find(x => x.key === k);
  const row = {id: it.id, visit_id: S.visit.id, location_id: o.location_id, location_name: o.name, sort_order: o.sort,
    condition: it.condition, remarks: it.remarks.trim() || null, photos: it.photos, updated_at: new Date().toISOString()};
  let {error} = await sb.from('visit_items').upsert(row);
  if (error && error.code === '23505' && o.location_id != null) {
    // another session already saved a row for this location in this visit: merge into that row (never overwrite with blanks)
    const {data: ex, error: e0} = await sb.from('visit_items').select('*').eq('visit_id', row.visit_id).eq('location_id', row.location_id).limit(1);
    if (e0 || !ex || !ex.length) error = e0 || error;
    else {
      const cur = ex[0], photos = [...new Set([...(cur.photos || []), ...row.photos])];
      const merged = {condition: row.condition || cur.condition, remarks: row.remarks || cur.remarks, photos, sort_order: row.sort_order, updated_at: row.updated_at};
      ({error} = await sb.from('visit_items').update(merged).eq('id', cur.id));
      if (!error) { it.id = cur.id; it.condition = merged.condition; it.photos = photos; if (merged.remarks && !it.remarks) it.remarks = merged.remarks; renderPhotos(k); }
    }
  }
  if (error) { setSave('err'); toast('Save failed: ' + error.message, true); return false; }
  it.saved = true;
  if (!Object.keys(S.timers).length) setSave('ok');
  return true;
}
function updateProgress() {
  const n = S.order.filter(o => S.items[o.key].condition).length, t = S.order.length;
  $('#progbar').style.width = (t ? n / t * 100 : 0) + '%';
  $('#progtxt').textContent = `— ${n} of ${t} assessed`;
}
function updateFinish() { $('#btn-finish').disabled = S.uploads > 0; $('#btn-finish').textContent = S.uploads > 0 ? 'Uploading photos…' : '■ Finish Activity'; }

async function finishVisit() {
  const missing = S.order.filter(o => !S.items[o.key].condition);
  if (missing.length && !confirm(`${missing.length} location(s) have no condition set:\n\n• ${missing.map(o => o.name).join('\n• ')}\n\nFinish anyway?`)) return;
  const btn = $('#btn-finish'); btn.disabled = true; btn.textContent = 'Finishing…';
  try {
    // make sure every location row exists (even untouched) and nothing is pending
    const ok = await Promise.all(S.order.map(o => saveItem(o.key)));
    if (ok.includes(false)) throw new Error('Some items could not be saved');
    const finished = new Date().toISOString();
    const {data, error} = await sb.from('visits').update({finished_at: finished, status: 'completed'}).eq('id', S.visit.id).select().single();
    if (error) throw error;
    clearInterval(S.tick); SI.visits = null;
    showDone(data);
  } catch (e) { toast('Could not finish: ' + (e.message || e), true); console.error(e); updateFinish(); }
}

function showDone(v) {
  const t = tally(S.order.map(o => S.items[o.key]));
  $('#stage').classList.add('hide');
  const d = $('#done'); d.classList.remove('hide');
  d.innerHTML = `<div class="tick">✓</div><h2 style="font-size:22px">Inspection completed</h2>

async function fetchAllCompleted() {

const numKey = n => { const x = parseInt(n, 10); return isNaN(x) ? Infinity : x; };

function computeSites() {
  const off = CONFIG.TZ_OFFSET || '+04:00';
  const a = SI.from ? new Date(SI.from + 'T00:00:00' + off).getTime() : -Infinity, b = SI.to ? new Date(SI.to + 'T23:59:59.999' + off).getTime() : Infinity;
  const by = new Map();
  SI.visits.forEach(v => {
    const t = new Date(v.started_at).getTime(), x = by.get(v.mosque_id) || {all: 0, inr: 0};
    if (t > x.all) x.all = t;
    if (t >= a && t <= b && t > x.inr) x.inr = t;
    by.set(v.mosque_id, x);
  });
  const q = SI.q.trim().toLowerCase();
  return S.mosques.filter(m => (!SI.zone || m.zone === SI.zone) && (!q || m._s.includes(q))).map(m => {
    const x = by.get(m.id) || {all: 0, inr: 0};
    return {m, visited: !!x.inr, last: x.inr || x.all, lastAll: x.all};
  });
}

const rad = d => d * Math.PI / 180;
function haversine(a, b) {
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

function makeRoutePDF(btn) {
  const mm = SI.start.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!mm) return toast('Enter the start point as latitude, longitude', true);
  const start = [parseFloat(mm[1]), parseFloat(mm[2])];
  if (Math.abs(start[0]) > 90 || Math.abs(start[1]) > 180) return toast('Those coordinates look invalid', true);
  const list = SI.cur || [];
  if (!list.length) return toast('No sites in the list to export', true);
  btn.disabled = true;
  try {
    const withC = list.filter(r => r.m.latitude != null), without = list.filter(r => r.m.latitude == null);
    const stops = []; let total = 0;
    if (SI.ord === 'near') {
      withC.map(r => ({r, d: haversine(start, [r.m.latitude, r.m.longitude])})).sort((a, b) => a.d - b.d).forEach(x => { stops.push(x); total += x.d; });
    } else {
      let cur = start; const rest = withC.slice();
      while (rest.length) {
        let bi = 0, bd = Infinity;
        rest.forEach((r, i) => { const d = haversine(cur, [r.m.latitude, r.m.longitude]); if (d < bd) { bd = d; bi = i; } });
        const [r] = rest.splice(bi, 1); stops.push({r, d: bd}); total += bd; cur = [r.m.latitude, r.m.longitude];
      }
    }
    const doc = new jspdf.jsPDF({unit: 'mm', format: 'a4'}), W = 210, M = 14;
    const hasRange = SI.from || SI.to, off = CONFIG.TZ_OFFSET || '+04:00';
    const dtxt = d => fmtDate(new Date(d + 'T12:00:00' + off).toISOString());
    const filt = [SI.zone || 'All zones', SI.status === 'not' ? (hasRange ? 'Not visited in period' : 'Pending (not visited yet)') : SI.status === 'visited' ? 'Visited' : 'All sites',
      hasRange ? `${SI.from ? dtxt(SI.from) : 'start'} to ${SI.to ? dtxt(SI.to) : 'today'}` : '', SI.q ? `Search: ${SI.q}` : ''].filter(Boolean).join('  |  ');
    doc.setFillColor(15, 91, 74); doc.rect(0, 0, W, 34, 'F'); doc.setFillColor(184, 137, 59); doc.rect(0, 34, W, 1.2, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.text('Site Visit Route List', M, 13);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(214, 235, 227);
    doc.text(pdfSafe('Fujairah Awqaf Project  |  ' + filt), M, 20, {maxWidth: W - 2 * M});
    doc.setFontSize(9);
    doc.text(`Start point: ${start[0].toFixed(6)}, ${start[1].toFixed(6)}  |  ${SI.ord === 'near' ? 'Ordered by distance from the start point' : 'Nearest-next route (each stop is the closest remaining site to the previous one)'}`, M, 26, {maxWidth: W - 2 * M});
    doc.text(`${list.length} site${list.length > 1 ? 's' : ''}  |  ${SI.ord === 'near' ? '' : 'Approx. route length ' + total.toFixed(1) + ' km  |  '}Straight-line distances  |  Generated ${fmtDT(new Date().toISOString())}`, M, 31);
    const url = m => `https://www.google.com/maps/search/?api=1&query=${m.latitude},${m.longitude}`;
    const statusTxt = r => r.visited ? 'Visited ' + fmtDate(new Date(r.last).toISOString()) : (r.lastAll ? 'Pending (last ' + fmtDate(new Date(r.lastAll).toISOString()) + ')' : 'Pending');
    const cols = [{h: '#', w: 9}, {h: 'Mosque No.', w: 17}, {h: 'Mosque', w: 56}, {h: 'Area', w: 28}, {h: 'Status', w: 31}, {h: SI.ord === 'near' ? 'From start' : 'Leg km', w: 15, r: 1}, {h: 'Map', w: 26}];
    let y = pdfTable(doc, 42, 'Sites in visiting order', cols, stops.map((x, i) =>
      [i + 1, x.r.m.mosque_number, x.r.m.name.trim(), x.r.m.location || '', statusTxt(x.r), x.d.toFixed(1), {t: 'Open map', url: url(x.r.m)}]));
    if (without.length) pdfTable(doc, y, 'No map coordinates on file (not included in the route)', cols.slice(0, 5).concat([{h: '', w: 15}, {h: '', w: 26}]),
      without.map((r, i) => ['-', r.m.mosque_number, r.m.name.trim(), r.m.location || '', statusTxt(r), '', '']));
    pdfFooters(doc, () => `Route list  |  ${SI.zone || 'All zones'}`);
    doc.save(`Route_${(SI.zone || 'AllZones').replace(/\s+/g, '')}_${SI.status === 'not' ? 'Pending' : SI.status === 'visited' ? 'Visited' : 'All'}_${dayKey(new Date().toISOString())}.pdf`);
    toast('Route PDF ready');
  } catch (e) { toast('Could not create PDF: ' + (e.message || e), true); console.error(e); }
  btn.disabled = false;
}

}

async function loadAdmin() {
  const {data, error} = await sb.from('locations').select('*').order('sort_order').order('id');
  if (error) { $('#alist').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  AD.rows = data; drawAdmin();
}

function drawAdmin() {
  const box = $('#alist');
  if (!AD.rows.length) { box.innerHTML = '<div class="empty">No locations yet — add the first one above.</div>'; return; }
  box.innerHTML = AD.rows.map((r, i) => `<div class="arow ${r.active ? '' : 'off'}" data-id="${r.id}">
    <span class="idx">${i + 1}</span>
    <input type="text" value="${esc(r.name)}" data-name maxlength="80" aria-label="Location name">
    <button class="iconb" data-up ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
    <button class="iconb" data-dn ${i === AD.rows.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
    <label class="sw" title="${r.active ? 'Active' : 'Hidden'}"><input type="checkbox" data-act ${r.active ? 'checked' : ''}><span></span></label>
    <button class="iconb" data-del title="Delete">🗑</button></div>`).join('');
  $$('.arow', box).forEach(row => {
    const id = +row.dataset.id, r = AD.rows.find(x => x.id === id), i = AD.rows.indexOf(r);
    $('[data-name]', row).onchange = async e => {
      const v = e.target.value.trim(); if (!v) { e.target.value = r.name; return; }
      const {error} = await sb.from('locations').update({name: v}).eq('id', id);
      if (error) return adminErr(error); r.name = v; toast('Renamed');
    };
    $('[data-act]', row).onchange = async e => {
      const {error} = await sb.from('locations').update({active: e.target.checked}).eq('id', id);
      if (error) { e.target.checked = r.active; return adminErr(error); } r.active = e.target.checked; drawAdmin();
    };
    $('[data-up]', row).onclick = () => move(i, -1);
    $('[data-dn]', row).onclick = () => move(i, 1);
    $('[data-del]', row).onclick = async () => {
      if (!confirm(`Delete “${r.name}”?\n\nPast inspection reports keep their recorded results. To just hide it from new inspections, use the switch instead.`)) return;
      const {error} = await sb.from('locations').delete().eq('id', id);
      if (error) return adminErr(error); AD.rows.splice(i, 1); drawAdmin(); toast('Deleted');
    };
  });
}

async function move(i, d) {
  const j = i + d; if (j < 0 || j >= AD.rows.length) return;
  [AD.rows[i], AD.rows[j]] = [AD.rows[j], AD.rows[i]];
  AD.rows.forEach((r, n) => r.sort_order = n + 1);
  drawAdmin();
  const res = await Promise.all(AD.rows.map(r => sb.from('locations').update({sort_order: r.sort_order}).eq('id', r.id)));
  const bad = res.find(x => x.error);
  if (bad) { adminErr(bad.error); loadAdmin(); }
}

let addingLoc = false;
async function addLoc() {
  if (addingLoc) return;                       // ignore double taps / Enter + button
  const inp = $('#new-loc'), btn = $('#add-loc'), name = inp.value.trim().replace(/\s+/g, ' '); if (!name) return inp.focus();
  if (AD.rows.some(r => nameKey(r.name) === nameKey(name))) { inp.select(); return toast(`"${name}" is already in the list`, true); }
  addingLoc = true; btn.disabled = true; inp.value = '';
  try {
    const next = AD.rows.reduce((m, r) => Math.max(m, r.sort_order), 0) + 1;
    const {data, error} = await sb.from('locations').insert({name, sort_order: next}).select().single();
    if (error) { inp.value = name; return error.code === '23505' ? toast(`"${name}" is already in the list`, true) : adminErr(error); }
    $('#aerr').classList.add('hide');
    AD.rows.push(data); drawAdmin(); toast('Location added');
  } finally { addingLoc = false; btn.disabled = false; inp.focus(); }
}

   REPORTS (PDF / Excel)
   ===================================================================== */
async function runReport(btn, kind, id) {
  if (!S.admin) return toast('Reports are available to admins only', true);
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    let [{data: v, error: e1}, {data: items, error: e2}] = await Promise.all([
      sb.from('visits').select('*').eq('id', id).single(),
      sb.from('visit_items').select('*').eq('visit_id', id).order('sort_order')
    ]);
    if (e1) throw e1; if (e2) throw e2;
    items = mergeItems(items);
    toast('Preparing report…');
    const photos = await preloadPhotos(items, kind === 'pdf' ? {max: 800, q: 0.78} : {max: 640, q: 0.75});
    const name = `Mosque-${v.mosque_number}_${dayKey(v.started_at)}_${fmtTime(v.started_at).replace(/[: ]/g, '').toLowerCase()}`;
    if (kind === 'pdf') savePDF(v, items, photos, name + '.pdf'); else await saveXLSX(v, items, photos, name + '.xlsx');
    toast('Report ready');
  } catch (e) { toast('Report failed: ' + (e.message || e), true); console.error(e); }
  btn.disabled = false; btn.innerHTML = old;
}

/* fetch every photo once, normalise to a JPEG data URL with dimensions */
async function preloadPhotos(items, o = {}) {
  const MAX = o.max || 1100, Q = o.q || 0.8;
  const urls = [...new Set(items.flatMap(i => i.photos || []))], map = {};
  let n = 0;
  const work = async () => {
    while (n < urls.length) {
      const u = urls[n++];
      try {
        const blob = await (await fetch(u, {mode: 'cors'})).blob();
        const bmp = await createImageBitmap(blob);
        const r = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
        const c = document.createElement('canvas'); c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
        map[u] = {data: c.toDataURL('image/jpeg', Q), w: c.width, h: c.height};
      } catch (e) { console.warn('photo failed', u, e); map[u] = null; }
      if (o.onProgress) o.onProgress(Object.keys(map).length, urls.length);
    }
  };
  await Promise.all(Array.from({length: Math.min(4, urls.length)}, work));
  return map;
}

function download(blob, filename) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const pdfSafe = s => String(s ?? '').replace(/[ʻʿ‘’`´]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-')
  .replace(/[^\x09\x0A\x20-\x7E -ÿ]/g, '?');
const COL = {Good: [46, 125, 79], Fair: [217, 149, 26], Poor: [192, 57, 43], 'N/A': [123, 135, 145], none: [150, 150, 150]};

function drawVisitPDF(doc, v, items, photos) {

    ['Duration', done ? fmtDur(v.started_at, v.finished_at) : '-'], ['Inspector', v.inspector || '-']
  ];
  const colW = (W - 2 * M - 8) / 2;
  const heights = [];
  for (let r = 0; r < 4; r++) {
    const l = doc.splitTextToSize(pdfSafe(info[r * 2][1]), colW - 6).length, rr = doc.splitTextToSize(pdfSafe(info[r * 2 + 1][1]), colW - 6).length;
    heights.push(6 + Math.max(l, rr) * 5 + 2);
  }
  const panelH = heights.reduce((a, b) => a + b, 0) + 4;
  doc.setFillColor(248, 246, 240); doc.setDrawColor(227, 222, 210); doc.roundedRect(M, y, W - 2 * M, panelH, 2.5, 2.5, 'FD');
  let py = y + 4;
  for (let r = 0; r < 4; r++) {

      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(29, 38, 35);
      doc.text(doc.splitTextToSize(pdfSafe(val), colW - 6), x, py + 8.5);
    }
    py += heights[r];
  }
  y += panelH + 7;

  // summary chips
  const t = tally(items);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(29, 38, 35); T('Summary', M, y + 3);
  let cx = M + 22;
  [['Good', t.Good], ['Fair', t.Fair], ['Poor', t.Poor], ['N/A', t['N/A']], ['Not assessed', t.Un]].forEach(([k, n]) => {
    if (!n) return;
    const c = COL[k] || COL.none, label = `${n} ${k}`, w = doc.getTextWidth(label) + 8;
    doc.setFillColor(...c); doc.roundedRect(cx, y - 1.5, w, 6.5, 3.2, 3.2, 'F');
    doc.setTextColor(255); doc.setFontSize(8.5); T(label, cx + 4, y + 3); cx += w + 3;
  });
  doc.setFont('helvetica', 'bold'); y += 12;
  doc.setDrawColor(227, 222, 210); doc.line(M, y - 3, W - M, y - 3);

  // locations
  const pw = (W - 2 * M - 8) / 3, ph = 44;
  items.forEach((it, idx) => {
    const remarks = it.remarks ? doc.splitTextToSize(pdfSafe(it.remarks), W - 2 * M - 8) : [];
    const need = 11 + (remarks.length ? remarks.length * 4.6 + 3 : 0) + ((it.photos || []).length ? ph + 4 : 0);
    if (y + need > H - FOOT) { doc.addPage(); y = 16; }
    const c = COL[it.condition || 'none'];
    // heading bar
    doc.setFillColor(248, 246, 240); doc.rect(M, y, W - 2 * M, 9, 'F');
    doc.setFillColor(...c); doc.rect(M, y, 1.8, 9, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(29, 38, 35);
    T(`${idx + 1}.  ${it.location_name}`, M + 5, y + 6.1);
    const lab = it.condition || 'Not assessed', lw = doc.getTextWidth(lab) + 9;
    doc.setFillColor(...c); doc.roundedRect(W - M - lw - 2, y + 1.5, lw, 6, 3, 3, 'F');
    doc.setTextColor(255); doc.setFontSize(8.5); T(lab, W - M - lw - 2 + 4.5, y + 5.7);
    y += 13;

      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(40, 48, 45);
      remarks.forEach((ln, i) => { if (y + 4.6 > H - FOOT) { doc.addPage(); y = 16; } doc.text(ln, M + 4, y + 4.4 + i * 0 ); y += 4.6; });

        if (p) {

          doc.addImage(p.data, 'JPEG', x + (pw - w) / 2, y + (ph - h) / 2, w, h, undefined, 'FAST');
        } else { doc.setFontSize(8); doc.setTextColor(150); doc.setFont('helvetica', 'normal'); T('Photo unavailable', x + pw / 2, y + ph / 2, {align: 'center'}); }

      y += ph + 4;
    }
    y += 5;
  });

}

function pdfFooters(doc, labelFor) {
  const W = 210, H = 297, M = 14, n = doc.getNumberOfPages();

    doc.text(pdfSafe(labelFor(p)), M, H - 6.5);
    doc.text(`Page ${p} of ${n}`, W - M, H - 6.5, {align: 'right'});
  }
}

/* ---------------- consolidated (date-range) report ---------------- */
function consolidate(visits) {
  const t = {Good: 0, Fair: 0, Poor: 0, 'N/A': 0, Un: 0}, zones = {}, mosques = new Set(), poor = []; let items = 0;
  visits.forEach(v => {
    mosques.add(v.mosque_id ?? v.mosque_number);
    const z = v.zone || '-', zr = zones[z] || (zones[z] = {visits: 0, m: new Set(), Good: 0, Fair: 0, Poor: 0, 'N/A': 0, Un: 0});
    zr.visits++; zr.m.add(v.mosque_id ?? v.mosque_number);
    (v.items || []).forEach(i => { items++; const c = i.condition || 'Un'; t[c]++; zr[c]++; if (c === 'Poor') poor.push({v, i}); });
  });
  return {visits: visits.length, mosques: mosques.size, items, t, zones, poor};
}

function pdfTable(doc, y, title, cols, rows, emptyMsg) {
  const W = 210, H = 297, M = 14, FOOT = 14;
  const head = () => {
    doc.setFillColor(15, 91, 74); doc.rect(M, y, W - 2 * M, 6.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(255);
    let x = M; cols.forEach(c => { c.r ? doc.text(pdfSafe(c.h), x + c.w - 2, y + 4.5, {align: 'right'}) : doc.text(pdfSafe(c.h), x + 2, y + 4.5); x += c.w; });
    y += 6.5;
  };
  if (y + 24 > H - FOOT) { doc.addPage(); y = 16; }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(29, 38, 35); doc.text(pdfSafe(title), M, y + 3.5); y += 7;
  if (!rows.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(120); doc.text(pdfSafe(emptyMsg || 'None'), M, y + 4); return y + 12; }
  head();
  rows.forEach((r, ri) => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    const urls = r.map(val => val && val.url), cells = r.map((val, i) => doc.splitTextToSize(pdfSafe(val && val.t !== undefined ? val.t : val), cols[i].w - 4).slice(0, 2));
    const h = Math.max(...cells.map(c => c.length)) * 4 + 2.6;
    if (y + h > H - FOOT) { doc.addPage(); y = 16; head(); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); }
    if (ri % 2 === 0) { doc.setFillColor(250, 248, 243); doc.rect(M, y, W - 2 * M, h, 'F'); }
    doc.setTextColor(40, 48, 45);
    let x = M; cells.forEach((c, i) => {
      if (urls[i]) { doc.setTextColor(26, 94, 200); doc.setFont('helvetica', 'bold'); }
      c.forEach((ln, li) => cols[i].r ? doc.text(ln, x + cols[i].w - 2, y + 4 + li * 4, {align: 'right'}) : doc.text(ln, x + 2, y + 4 + li * 4));
      if (urls[i]) { doc.link(x, y, cols[i].w, h, {url: urls[i]}); const tw = doc.getTextWidth(c[0]); doc.setDrawColor(26, 94, 200); doc.setLineWidth(0.2); doc.line(x + 2, y + 4.8, x + 2 + tw, y + 4.8); doc.setTextColor(40, 48, 45); doc.setFont('helvetica', 'normal'); }
      x += cols[i].w;
    });
    y += h;
  });
  return y + 7;
}

  pdfTable(doc, y, 'Inspections in this period', [{h: '#', w: 9}, {h: 'Mosque No.', w: 20}, {h: 'Mosque', w: 46}, {h: 'Zone', w: 16}, {h: 'Date', w: 24}, {h: 'Time', w: 36}, {h: 'Good', w: 10, r: 1}, {h: 'Fair', w: 10, r: 1}, {h: 'Poor', w: 11, r: 1}],

function saveConsolidatedPDF(visits, photos, meta, filename) {
  const doc = new jspdf.jsPDF({unit: 'mm', format: 'a4'}), labels = {};
  drawSummaryPDF(doc, visits, meta);
  for (let p = 1; p <= doc.getNumberOfPages(); p++) labels[p] = `Consolidated report  |  ${meta.periodText}`;
  visits.forEach(v => {
    doc.addPage(); const p0 = doc.getNumberOfPages();
    drawVisitPDF(doc, v, v.items, photos);
    for (let p = p0; p <= doc.getNumberOfPages(); p++) labels[p] = `Mosque ${v.mosque_number}  |  ${fmtDate(v.started_at)}`;
  });
  pdfFooters(doc, p => labels[p] || '');
  doc.save(filename);
}
