    ['Inspection Date', fmtDate(v.started_at)], ['Start Time', fmtTime(v.started_at)],
    ['Finish Time', done ? fmtTime(v.finished_at) : 'In progress'], ['Duration', done ? fmtDur(v.started_at, v.finished_at) : ''],
    ['Inspector', v.inspector || '']
  ];
  let r = 3;
  info.forEach(([k, val]) => {
    ws.mergeCells(r, 2, r, 3); ws.mergeCells(r, 4, r, 5);
    const a = ws.getCell(r, 2), b = ws.getCell(r, 4);
    a.value = k; a.font = {bold: true, color: {argb: 'FF68746F'}}; a.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: SAND}};
    b.value = val; b.font = {bold: true}; b.alignment = {horizontal: 'left'};
    r++;
  });
  ws.getCell(3, 4).numFmt = '@'; // keep mosque number as text
  r += 1;
  const tl = tally(items);
  ws.getCell(r, 2).value = 'Summary'; ws.getCell(r, 2).font = {bold: true};
  ws.getCell(r, 4).value = `Good: ${tl.Good}   Fair: ${tl.Fair}   Poor: ${tl.Poor}   N/A: ${tl['N/A']}   Not assessed: ${tl.Un}`;
  r += 2;

  const hr = r;
  ['#', 'Location', 'Status', 'Remarks', 'Photos'].forEach((h, i) => {
    const c = ws.getCell(hr, i + 1); c.value = h; c.font = {bold: true, color: {argb: 'FFFFFFFF'}};
    c.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: GREEN}}; c.alignment = {vertical: 'middle', indent: 1};
  });
  if (lastCol > 5) { ws.mergeCells(hr, 5, hr, lastCol); }
  ws.getRow(hr).height = 24;
  const bd = {style: 'thin', color: {argb: 'FFE3DED2'}};
  r = hr + 1;
  for (const [i, it] of items.entries()) {
    const row = ws.getRow(r), ps = it.photos || [];
    row.getCell(1).value = i + 1;
    row.getCell(2).value = it.location_name; row.getCell(2).font = {bold: true};
    const sc = row.getCell(3); sc.value = it.condition || 'Not assessed';
    sc.alignment = {horizontal: 'center', vertical: 'middle'};
    sc.font = {bold: true, color: {argb: 'FFFFFFFF'}}; sc.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: argb[it.condition] || 'FF969696'}};
    row.getCell(4).value = it.remarks || ''; row.getCell(4).alignment = {wrapText: true, vertical: 'top'};
    [1, 2].forEach(c => row.getCell(c).alignment = {vertical: 'top', wrapText: true, horizontal: c === 1 ? 'center' : 'left'});
    row.height = ps.length ? 118 : Math.max(30, 15 * Math.ceil((it.remarks || '').length / 48));
    for (let c = 1; c <= lastCol; c++) row.getCell(c).border = {top: bd, bottom: bd, left: c <= 4 ? bd : undefined};
    ps.slice(0, 12).forEach((u, j) => {
      const p = photos[u];
      if (!p) { row.getCell(5 + j).value = 'Photo unavailable'; return; }
      const s = Math.min(160 / p.w, 118 / p.h), w = Math.round(p.w * s), h = Math.round(p.h * s);
      const id = wb.addImage({base64: p.data, extension: 'jpeg'});
      ws.addImage(id, {tl: {col: 4 + j + 0.06, row: r - 1 + 0.06}, ext: {width: w, height: h}});
    });
    r++;
  }
  const buf = await wb.xlsx.writeBuffer();
  download(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), filename);
}

async function saveConsolidatedXLSX(visits, photos, meta, filename) {
  const wb = new ExcelJS.Workbook(); wb.creator = 'Fujairah Awqaf Inspection'; wb.created = new Date();
  const st = consolidate(visits), GREEN = 'FF0F5B4A', SAND = 'FFF8F6F0';
  const fill = c => ({type: 'pattern', pattern: 'solid', fgColor: {argb: c}});
  const argb = {Good: 'FF2E7D4F', Fair: 'FFD9951A', Poor: 'FFC0392B', 'N/A': 'FF7B8791'};
  const hdr = (row, n) => { for (let c = 1; c <= n; c++) { const x = row.getCell(c); x.font = {bold: true, color: {argb: 'FFFFFFFF'}}; x.fill = fill(GREEN); x.alignment = {vertical: 'middle', wrapText: true}; } row.height = 24; };

  // --- Summary
  const ws = wb.addWorksheet('Summary', {views: [{showGridLines: false}]});
  [30, 16, 14, 12, 12, 12, 12].forEach((w, i) => ws.getColumn(i + 1).width = w);
  ws.mergeCells('A1:G1'); const t = ws.getCell('A1'); t.value = 'Fujairah Awqaf Project - Consolidated Inspection Report';
  t.font = {bold: true, size: 16, color: {argb: 'FFFFFFFF'}}; t.fill = fill(GREEN); t.alignment = {vertical: 'middle', indent: 1}; ws.getRow(1).height = 34;
  [['Period', meta.periodText], ['Zone', meta.zone || 'All zones'], ['Generated', fmtDT(new Date().toISOString())], ['Inspections', st.visits], ['Mosques covered', st.mosques],
   ['Locations checked', st.items], ['Good', st.t.Good], ['Fair', st.t.Fair], ['Poor', st.t.Poor], ['N/A', st.t['N/A']], ['Not assessed', st.t.Un]].forEach(([k, v], i) => {
    const r = 3 + i; ws.getCell(r, 1).value = k; ws.getCell(r, 1).font = {bold: true, color: {argb: 'FF68746F'}}; ws.getCell(r, 1).fill = fill(SAND);
    ws.getCell(r, 2).value = v; ws.getCell(r, 2).font = {bold: true}; ws.getCell(r, 2).alignment = {horizontal: 'left'};
  });
  let r = 16; ['Zone', 'Inspections', 'Mosques', 'Good', 'Fair', 'Poor', 'N/A'].forEach((h, i) => ws.getCell(r, i + 1).value = h); hdr(ws.getRow(r), 7);
  Object.keys(st.zones).sort().forEach(z => { r++; const x = st.zones[z]; [z, x.visits, x.m.size, x.Good, x.Fair, x.Poor, x['N/A']].forEach((v, i) => ws.getCell(r, i + 1).value = v); });

  // --- Visits
  const wv = wb.addWorksheet('Visits', {views: [{state: 'frozen', ySplit: 1}]});
  const vc = [['Mosque No.', 11], ['Mosque', 34], ['Zone', 10], ['Location', 18], ['Date', 13], ['Start', 10], ['Finish', 10], ['Duration (min)', 14], ['Inspector', 18], ['Good', 8], ['Fair', 8], ['Poor', 8], ['N/A', 8], ['Not assessed', 13]];
  vc.forEach(([h, w], i) => { wv.getCell(1, i + 1).value = h; wv.getColumn(i + 1).width = w; }); hdr(wv.getRow(1), vc.length);
  visits.forEach((v, n) => {
    const tl = tally(v.items), mins = Math.round((new Date(v.finished_at) - new Date(v.started_at)) / 60000);
    [String(v.mosque_number), v.mosque_name || '', v.zone || '', v.location || '', fmtDate(v.started_at), fmtTime(v.started_at), fmtTime(v.finished_at), mins, v.inspector || '', tl.Good, tl.Fair, tl.Poor, tl['N/A'], tl.Un]
      .forEach((val, i) => wv.getCell(n + 2, i + 1).value = val);
  });
  wv.autoFilter = {from: {row: 1, column: 1}, to: {row: 1, column: vc.length}};

  // --- Details (one row per location per visit)
  const wd = wb.addWorksheet('Details', {views: [{state: 'frozen', ySplit: 1}]});
  const maxPh = Math.min(10, Math.max(0, ...visits.flatMap(v => v.items.map(i => (i.photos || []).length))));
  const dc = [['Mosque No.', 11], ['Mosque', 30], ['Zone', 10], ['Date', 13], ['Start', 10], ['Location', 28], ['Status', 14], ['Remarks', 44]];
  dc.forEach(([h, w], i) => { wd.getCell(1, i + 1).value = h; wd.getColumn(i + 1).width = w; });
  if (maxPh) { wd.getCell(1, 9).value = 'Photos'; for (let c = 0; c < maxPh; c++) wd.getColumn(9 + c).width = 24; if (maxPh > 1) wd.mergeCells(1, 9, 1, 8 + maxPh); }
  hdr(wd.getRow(1), 8 + Math.max(1, maxPh));
  const bd = {style: 'thin', color: {argb: 'FFE3DED2'}};
  let dr = 2;
  for (const v of visits) for (const it of v.items) {
    const ps = it.photos || [], row = wd.getRow(dr);
    [String(v.mosque_number), v.mosque_name || '', v.zone || '', fmtDate(v.started_at), fmtTime(v.started_at), it.location_name, it.condition || 'Not assessed', it.remarks || '']
      .forEach((val, i) => { const c = row.getCell(i + 1); c.value = val; c.alignment = {vertical: 'top', wrapText: true}; c.border = {bottom: bd}; });
    const sc = row.getCell(7); sc.font = {bold: true, color: {argb: 'FFFFFFFF'}}; sc.fill = fill(argb[it.condition] || 'FF969696'); sc.alignment = {horizontal: 'center', vertical: 'middle'};
    row.height = ps.length ? 118 : Math.max(20, 15 * Math.ceil((it.remarks || '').length / 48));
    ps.slice(0, 10).forEach((u, j) => {
      const p = photos[u]; if (!p) { row.getCell(9 + j).value = 'Photo unavailable'; return; }
      const sc2 = Math.min(160 / p.w, 112 / p.h), id = wb.addImage({base64: p.data, extension: 'jpeg'});
      wd.addImage(id, {tl: {col: 8 + j + 0.06, row: dr - 1 + 0.06}, ext: {width: Math.round(p.w * sc2), height: Math.round(p.h * sc2)}});
    });
    dr++;
  }
  wd.autoFilter = {from: {row: 1, column: 1}, to: {row: 1, column: 8}};
  const buf = await wb.xlsx.writeBuffer();
  download(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), filename);
}

function reportFilters() {
  const from = $('#rp-from').value, to = $('#rp-to').value, zone = $('#rp-zone').value, off = CONFIG.TZ_OFFSET || '+04:00';
  return {from, to, zone, a: from && new Date(from + 'T00:00:00' + off).toISOString(), b: to && new Date(to + 'T23:59:59.999' + off).toISOString()};
}

async function fetchRange(f, withItems) {
  let q = sb.from('visits').select(withItems ? '*, visit_items(*)' : 'id, zone, mosque_id, mosque_number').eq('status', 'completed')
    .gte('started_at', f.a).lte('started_at', f.b).order('started_at', {ascending: true}).limit(1000);
  if (f.zone) q = q.eq('zone', f.zone);
  const {data, error} = await q; if (error) throw error;
  if (withItems) data.forEach(v => v.visit_items = mergeItems(v.visit_items));
  return data;
}

let countT;
function updateCount() {
  clearTimeout(countT);
  const el = $('#rp-count'); if (!el) return;
  const f = reportFilters();
  if (!f.from || !f.to) { el.textContent = 'Choose a start and end date.'; return; }
  if (f.from > f.to) { el.innerHTML = '<span style="color:var(--poor)">The start date is after the end date.</span>'; return; }
  el.innerHTML = '<span class="spin"></span>';
  countT = setTimeout(async () => {
    try {
      const d = await fetchRange(f, false); if (!$('#rp-count')) return;
      const m = new Set(d.map(v => v.mosque_id ?? v.mosque_number)).size;
      $('#rp-count').textContent = d.length ? `${d.length} completed inspection${d.length > 1 ? 's' : ''} · ${m} mosque${m > 1 ? 's' : ''}${d.length >= 1000 ? ' (limit reached - narrow the dates)' : ''}` : 'No completed inspections in this period.';
    } catch (e) { $('#rp-count').textContent = 'Could not count: ' + (e.message || e); }
  }, 250);
}

async function runConsolidated(btn, kind) {
  if (!S.admin) return toast('Reports are available to admins only', true);
  const f = reportFilters();
  if (!f.from || !f.to || f.from > f.to) return toast('Pick a valid date range first', true);
  const incl = $('#rp-ph').checked, old = btn.innerHTML, both = [$('#rp-pdf'), $('#rp-xlsx')];
  both.forEach(b => b.disabled = true); btn.innerHTML = '<span class="spin"></span> Working…';
  try {
    const visits = await fetchRange(f, true);
    if (!visits.length) { toast('No completed inspections in this period', true); return; }
    visits.forEach(v => { v.items = (v.visit_items || []).slice().sort((a, b) => a.sort_order - b.sort_order).map(i => incl ? i : {...i, photos: []}); });
    const all = visits.flatMap(v => v.items);
    const nPhotos = new Set(all.flatMap(i => i.photos || [])).size;
    if (nPhotos > 300 && !confirm(`This report contains ${nPhotos} photos. It may take a few minutes and produce a large file.\n\nContinue? (Untick "Include photos" for a much smaller file.)`)) return;
    toast(nPhotos ? `Preparing report with ${nPhotos} photos…` : 'Preparing report…');
    const photos = nPhotos ? await preloadPhotos(all, {...(kind === 'pdf' ? {max: 640, q: 0.7} : {max: 480, q: 0.7}), onProgress: (n, t) => { btn.innerHTML = `<span class="spin"></span> Photos ${n}/${t}`; }}) : {};
    const iso = d => new Date(d + 'T12:00:00' + (CONFIG.TZ_OFFSET || '+04:00')).toISOString();
    const meta = {periodText: f.from === f.to ? fmtDate(iso(f.from)) : `${fmtDate(iso(f.from))} - ${fmtDate(iso(f.to))}`, zone: f.zone};
    const name = `Consolidated_${f.from}_to_${f.to}${f.zone ? '_' + f.zone.replace(/\s+/g, '') : ''}`;
    btn.innerHTML = '<span class="spin"></span> Building file…'; await new Promise(r => setTimeout(r, 30));
    if (kind === 'pdf') saveConsolidatedPDF(visits, photos, meta, name + '.pdf'); else await saveConsolidatedXLSX(visits, photos, meta, name + '.xlsx');
    toast('Report ready');
  } catch (e) { toast('Report failed: ' + (e.message || e), true); console.error(e); }
  finally { both.forEach(b => b.disabled = false); btn.innerHTML = old; }
}
</script>
